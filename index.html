<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #007BFF;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .toggle {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      color: #007BFF;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Login</h2>
    <form id="auth-form">
      <input type="text" id="name" placeholder="Name" required>
      <input type="password" id="password" placeholder="Password" required>
      <div id="extra-fields" style="display:none;">
        <input type="date" id="dob" placeholder="Date of Birth">
        <select id="gender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
        <input type="text" id="address" placeholder="Address">
      </div>
      <button type="submit">Submit</button>
    </form>
    <div class="toggle" onclick="toggleForm()">Switch to Signup</div>
  </div>

  <script>
    let isLogin = true;

    function toggleForm() {
      isLogin = !isLogin;
      document.getElementById("form-title").innerText = isLogin ? "Login" : "Signup";
      document.getElementById("extra-fields").style.display = isLogin ? "none" : "block";
      document.querySelector("button").innerText = isLogin ? "Login" : "Signup";
      document.querySelector(".toggle").innerText = isLogin ? "Switch to Signup" : "Switch to Login";
    }

    document.getElementById("auth-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const isSignup = !isLogin;
      const data = { name: document.getElementById("name").value, password: document.getElementById("password").value };
      if (isSignup) {
        data.dob = document.getElementById("dob").value;
        data.gender = document.getElementById("gender").value;
        data.address = document.getElementById("address").value;
      }

      const endpoint = isLogin ? "/login" : "/register";

      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(data)
      });

      const text = await response.text();

      if (isLogin && text.includes("Welcome")) {
        window.location.href = "/dashboard";
      } else {
        alert(text);
      }
    });
  </script>
</body>
</html>
